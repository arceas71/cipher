name: JARVIS Autonomous AI Agent

on:
  schedule:
    - cron: '0 */6 * * *'
  issues:
    types: [opened, labeled]
  workflow_dispatch:
    inputs:
      query:
        description: 'Task / Query for JARVIS Agent'
        required: false
        default: 'System Health Check & Autonomous Maintenance'

jobs:
  run-agent:
    name: Run JARVIS AI Agent
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml openai

      - name: Run JARVIS Python Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUERY: ${{ github.event.inputs.query || 'Automated Routine System Inspection' }}
        run: |
          python agent/jarvis_agent.py --query "$QUERY"
